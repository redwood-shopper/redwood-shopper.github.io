name: Mover fotos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fotos/walmart
          ls f-w-*.jpg >/dev/null 2>&1 && mv -f f-w-*.jpg fotos/walmart/ || true
          [ -f fotos.json ] && mv -f fotos.json fotos/walmart/fotos.json || true
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Mover fotos de Walmart" || echo "nada que mover"
          git push
