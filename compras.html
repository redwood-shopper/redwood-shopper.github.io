<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hoja de compra · Redwood Shopper</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#eef3ea;color:#1d2a1f}
header{position:sticky;top:0;background:#2f6b3a;color:#fff;padding:10px 14px;z-index:5}
header h1{margin:0;font-size:19px}header .sub{font-size:13px;opacity:.9;margin-top:2px}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd95a;width:0}
nav{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}nav button{flex:none;border:2px solid #2f6b3a;background:#fff;color:#2f6b3a;border-radius:20px;padding:9px 16px;font-size:16px;font-weight:700}
nav button.on{background:#2f6b3a;color:#fff}
main{padding:0 12px 90px;max-width:820px;margin:0 auto}
.sec{margin:16px 0 6px;font-size:18px;font-weight:800;background:#dcebd6;padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:14px;padding:10px;margin:8px 0;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card.f{background:#e6f6e3}.card.s{background:#fff3d6}.card.n{background:#fde5e3}
.card img{width:84px;height:84px;object-fit:contain;background:#fafafa;border-radius:8px;flex:none}
.ph{width:84px;height:84px;border-radius:8px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.info{flex:1;min-width:0}.nm{font-size:17px;font-weight:650;line-height:1.25}.sz{font-size:14px;color:#666;margin-top:2px}
.who{font-size:14px;margin-top:4px;color:#2f6b3a}.note{font-size:14px;margin-top:3px;background:#fff6dc;border-radius:6px;padding:3px 7px;display:inline-block}
.q{flex:none;align-self:flex-start;background:#2f6b3a;color:#fff;font-size:28px;font-weight:800;border-radius:12px;padding:6px 14px}
.btns{display:flex;gap:6px;margin-top:8px}.btns button{color:#1d2a1f;flex:1;border:2px solid #bbb;background:#fff;border-radius:10px;padding:10px 2px;font-size:15px;font-weight:700}
.btns .on.f{background:#2f6b3a;color:#fff;border-color:#2f6b3a}.btns .on.s{background:#e0a100;color:#fff;border-color:#e0a100}.btns .on.n{background:#c0392b;color:#fff;border-color:#c0392b}
.cli{background:#fff;border-radius:14px;margin:12px 0;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cli h3{margin:0 0 2px;font-size:20px}.cli .m{color:#666;font-size:14px;margin-bottom:8px}
.li{display:flex;gap:8px;padding:6px 0;border-top:1px solid #eee;font-size:15px}.li b{flex:none;width:34px}
.tag{font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px;flex:none;height:fit-content}
.tag.f{background:#cfeccb}.tag.s{background:#ffe3a0}.tag.n{background:#f7c4bf}.tag.p{background:#eee}
.cli button.msg{margin-top:10px;width:100%;border:0;background:#2f6b3a;color:#fff;border-radius:10px;padding:12px;font-size:16px;font-weight:700}
textarea{width:100%;height:120px;margin-top:8px;border:1px solid #ccc;border-radius:8px;padding:8px;font-size:15px}
.rst{margin:24px 0;text-align:center}.rst button{border:1px solid #999;background:#fff;border-radius:8px;padding:8px 14px;color:#666}
.demo{background:#fff6dc;font-size:13px;text-align:center;padding:5px}
</style></head><body>
<div class="demo">PRUEBA · pedidos de ejemplo</div>
<header><h1>🌲 Hoja de compra</h1><div class="sub" id="sub"></div><div class="bar"><i id="pb"></i></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
var ORDERS=[{"id": "0123", "cliente": "María G.", "zona": "Garberville", "hora": "4–6 pm", "items": [{"store": "Walgreens", "es": "Gas-X Cápsulas blandas extra fuerte para alivio de gases e hinchazón (20 pzas)", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Imodium A-D Caplets antidiarreicos con loperamida HCl para viaje", "q": 2, "sub": "si", "nota": "sin sabor a menta"}, {"store": "Walgreens", "es": "Liquid I.V. Mezcla de hidratación con electrolitos, sandía", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Benefiber Caplets de fibra prebiótica", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Metamucil Cápsulas de cáscara de psyllium 3 en 1, fibra diaria compatible con GLP-1", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Neo G Opti-Heal Tiras de silicona para recuperación de heridas, 1.6 x 5.9 pulgadas", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Walgreens Venda autoadherente de 1 pulgada, beige", "q": 3, "sub": "si", "nota": ""}]}, {"id": "0124", "cliente": "Juan P.", "zona": "Redway", "hora": "2–4 pm", "items": [{"store": "Walgreens", "es": "Gas-X Cápsulas blandas extra fuerte para alivio de gases e hinchazón (20 pzas)", "q": 2, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Gaviscon Antiácido líquido, menta fresca", "q": 1, "sub": "no", "nota": ""}, {"store": "Walgreens", "es": "MiraLAX Alivio suave del estreñimiento, naranja", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Walgreens Cinta atlética", "q": 2, "sub": "si", "nota": ""}]}, {"id": "0125", "cliente": "Rosa L.", "zona": "Garberville", "hora": "5–7 pm", "items": [{"store": "Walgreens", "es": "Imodium A-D Caplets antidiarreicos con loperamida HCl para viaje", "q": 1, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Walgreens Free & Pure Probiótico diario 4 en 1 para mujeres", "q": 1, "sub": "misma", "nota": ""}, {"store": "Walgreens", "es": "Benefiber Caplets de fibra prebiótica", "q": 2, "sub": "si", "nota": ""}, {"store": "Walgreens", "es": "Bonine Tabletas masticables para mareo por movimiento, frambuesa", "q": 1, "sub": "si", "nota": ""}]}];
var SECCIONES={"Cough, Cold & Allergy":"Tos, gripe y alergias","Medicine & Pain Relief":"Medicinas y dolor","Digestive & Stomach":"Digestivo y estómago","Laxatives & Constipation":"Laxantes y estreñimiento","First Aid":"Primeros auxilios","Vitamins & Supplements":"Vitaminas y suplementos","Oral Care":"Cuidado bucal","Skin, Hair & Body":"Piel, cabello y cuerpo","Home & Cleaning":"Hogar y limpieza","Pet Supplies":"Mascotas"};
/* Pasillos por tienda: completar aquí, ej. PASILLOS.Walgreens["Digestivo y estómago"]="Pasillo 14" */
var PASILLOS={Walgreens:{}};
var SUBTXT={si:"Acepta sustituto",misma:"Solo misma marca",no:"No sustituir"};
var DB={},FO={},ST={},view="lista",store=null,KEY="rs_compras_v1";
try{ST=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pk(s,n){return s+"|"+n}
function load(s){return Promise.all([fetch("precios-"+s.toLowerCase()+".json").then(function(r){return r.json()}),fetch("fotos/"+s.toLowerCase()+"/fotos.json").then(function(r){return r.ok?r.json():{}}).catch(function(){return{}})]).then(function(a){var m={};a[0].forEach(function(r){m[r[2]]=r});DB[s]=m;FO[s]=a[1]})}
function info(s,n){var r=(DB[s]||{})[n];if(!r)return{cat:"Otros",sz:"",foto:null};var f=(FO[s]||{})[n],file=f&&f.f;var ok=file&&/^f-[A-Za-z0-9._-]+\.(?:jpe?g|png|webp)$/i.test(file);return{cat:SECCIONES[r[1]]||r[1],sz:r[4]||"",foto:ok?"fotos/"+s.toLowerCase()+"/"+file:null}}
function agg(){var out={};ORDERS.forEach(function(o){o.items.forEach(function(it){var k=pk(it.store,it.es);var e=out[k]||(out[k]={store:it.store,es:it.es,q:0,who:[],notas:[]});e.q+=it.q;e.who.push(o.cliente+" ×"+it.q);if(it.nota)e.notas.push(o.cliente+": "+it.nota);if(it.sub!=="si")e.notas.push(o.cliente+": "+SUBTXT[it.sub])});});return out}
function stats(){var a=agg(),t=0,d=0;for(var k in a){t++;if(ST[k]&&ST[k].s)d++}return[t,d]}
function setS(k,s){ST[k]=ST[k]||{};ST[k].s=ST[k].s===s?null:s;if(ST[k].s==="s"&&!ST[k].sub){var x=prompt("¿Qué producto compraste en su lugar?","");if(x===null){ST[k].s=null}else ST[k].sub=x}save();render()}
function card(e){var k=pk(e.store,e.es),s=(ST[k]||{}).s||"",i=info(e.store,e.es);
return '<div class="card '+s+'">'+(i.foto?'<img src="'+i.foto+'" loading="lazy">':'<div class="ph">📦</div>')+'<div class="info"><div class="nm">'+esc(e.es)+'</div><div class="sz">'+esc(i.sz)+'</div><div class="who">'+esc(e.who.join(" · "))+'</div>'+e.notas.map(function(n){return '<div class="note">⚠️ '+esc(n)+'</div>'}).join(" ")+(s==="s"&&ST[k].sub?'<div class="note">↔ '+esc(ST[k].sub)+'</div>':'')+'<div class="btns">'+[["f","✔ Encontrado"],["s","↔ Sustituto"],["n","✖ No había"]].map(function(b){return '<button class="'+b[0]+(s===b[0]?' on':'')+'" data-k="'+esc(k)+'" data-s="'+b[0]+'">'+b[1]+'</button>'}).join("")+'</div></div><div class="q">×'+e.q+'</div></div>'}
function lista(){var a=agg(),g={};for(var k in a){var e=a[k];if(store&&e.store!==store)continue;var c=info(e.store,e.es).cat;(g[e.store+"|"+c]=g[e.store+"|"+c]||[]).push(e)}
var keys=Object.keys(g).sort(function(x,y){var px=(PASILLOS[x.split("|")[0]]||{})[x.split("|")[1]]||"zz",py=(PASILLOS[y.split("|")[0]]||{})[y.split("|")[1]]||"zz";return px<py?-1:px>py?1:x<y?-1:1});
return keys.map(function(k){var p=k.split("|"),pas=(PASILLOS[p[0]]||{})[p[1]];return '<div class="sec"><span>'+esc(p[1])+'</span><span>'+(pas?esc(pas):"")+'</span></div>'+g[k].sort(function(a,b){return a.es<b.es?-1:1}).map(card).join("")}).join("")}
var TAG={f:["f","Listo"],s:["s","Sustituto"],n:["n","No había"],"":["p","Pendiente"]};
function msg(o){var pend=o.items.filter(function(it){return !(ST[pk(it.store,it.es)]||{}).s}).length;if(pend)return "⚠️ Todavía faltan "+pend+" producto(s) por marcar. Termina de marcar la lista maestra y vuelve a tocar este botón.";var L=["Hola "+o.cliente.split(" ")[0]+", tu pedido de Redwood Shopper está listo 🌲"],fal=[];o.items.forEach(function(it){var st=ST[pk(it.store,it.es)]||{};if(st.s==="n")fal.push("• No había: "+it.es);if(st.s==="s")fal.push("• Sustituí "+it.es+" por: "+(st.sub||"?"))});if(fal.length){L.push("");L.push("Cambios:");L=L.concat(fal)}else L.push("Todo encontrado ✔");L.push("");L.push("Entrega hoy "+o.hora+".");return L.join("\n")}
function clientes(){return ORDERS.map(function(o){var n=o.items.reduce(function(a,i){return a+i.q},0);return '<div class="cli"><h3>🛍️ Bolsa #'+o.id+' · '+esc(o.cliente)+'</h3><div class="m">'+esc(o.zona)+' · '+esc(o.hora)+' · '+n+' piezas</div>'+o.items.map(function(it){var st=ST[pk(it.store,it.es)]||{},t=TAG[st.s||""];return '<div class="li"><b>×'+it.q+'</b><span style="flex:1">'+esc(it.es)+'</span><span class="tag '+t[0]+'">'+t[1]+'</span></div>'}).join("")+'<button class="msg" data-o="'+o.id+'">📲 Mensaje para el cliente</button><div id="m'+o.id+'"></div></div>'}).join("")}
function render(){var s=stats();document.getElementById("sub").textContent=ORDERS.length+" pedidos · "+s[1]+" de "+s[0]+" productos listos";document.getElementById("pb").style.width=(s[0]?100*s[1]/s[0]:0)+"%";
var stores=[];ORDERS.forEach(function(o){o.items.forEach(function(i){if(stores.indexOf(i.store)<0)stores.push(i.store)})});
document.getElementById("nav").innerHTML='<button data-v="lista" class="'+(view==="lista"?"on":"")+'">🛒 Lista maestra</button><button data-v="cli" class="'+(view==="cli"?"on":"")+'">🛍️ Por cliente</button>';
document.getElementById("main").innerHTML=(view==="lista"?lista():clientes())+'<div class="rst"><button id="rs">Reiniciar marcas</button></div>'}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.v){view=b.dataset.v;render()}else if(b.dataset.k){setS(b.dataset.k,b.dataset.s)}else if(b.dataset.o){var o=ORDERS.filter(function(x){return x.id===b.dataset.o})[0];var d=document.getElementById("m"+o.id);d.innerHTML='<textarea readonly>'+esc(msg(o))+'</textarea>';d.firstChild.select()}else if(b.id==="rs"){if(confirm("¿Borrar todas las marcas?")){ST={};save();render()}}});
Promise.all(["Walgreens"].map(load)).then(render).catch(function(){document.getElementById("main").innerHTML="<p>No se pudieron cargar los productos.</p>"});
</script></body></html>
