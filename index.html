 Food for People",gv8:"Ayuda con CalFresh en Garberville",gv9:"El programa de CalFresh del Parque Comunitario del Sur de Humboldt ayuda a solicitar y renovar beneficios, y reparte canastas de comida fresca de temporada. Teléfono (707) 923-2928.",gl2:"Programa CalFresh del Parque Comunitario",gv10:"Si quieres donar",gv11:"Puedes donar directamente a Food for People, que es una organización local. Pregunta en su sitio cómo hacerlo y si tu donación es deducible de impuestos.",gl3:"Donar a Food for People",gv12:"Vecinos ayudando a vecinos (próximamente)",gv13:"Estamos preparando una forma de que los vecinos se ayuden entre sí con Redwood Shopper. Todavía no está lista. Cuando lo esté, lo anunciaremos en Novedades.",gv14:"¿Quieres ayudar o necesitas ayuda? Escríbenos un mensaje en Facebook o Instagram. No incluyas información privada.",gl4:"Facebook de Redwood Shopper",gl5:"Instagram de Redwood Shopper",gv15:"⚠ Privacidad: no nos mandes tu número de tarjeta EBT, PIN, Seguro Social ni fotos de documentos.",ihH:"IHSS y apoyo para cuidadores",iq1:"Nuestra experiencia con IHSS",iq2:"Nuestra fundadora tiene experiencia directa como proveedora registrada de los Servicios de Apoyo en el Hogar (IHSS) y entiende la importancia de un cuidado compasivo, confiable y respetuoso.",iq3:"Valoramos el trabajo de los proveedores de IHSS y los cuidadores que ayudan a adultos mayores y a personas con discapacidades a mantener su independencia y a permanecer seguros en su hogar.",iq4:"Nos comprometemos a compartir información útil para cuidadores y a conectar a nuestra comunidad con los recursos disponibles.",iq5:"Redwood Shopper e IHSS",iq6:"Redwood Shopper es un negocio independiente de compras y entregas de comida, no una agencia oficial de IHSS.",iq7:"No le cobramos al programa IHSS ni determinamos la elegibilidad, los servicios autorizados ni las horas.",iq8:"Nuestra meta es hacer la vida diaria más fácil compartiendo información útil y conectando a personas y familias con recursos de la comunidad.",iq9:"¿Qué es IHSS?",iqa:"IHSS (Servicios de Apoyo en el Hogar) es un programa de California que ayuda a adultos mayores elegibles, personas con discapacidades y personas ciegas a recibir ayuda en su propio hogar.",iqb:"Cómo solicitarlo",iqc:"Comunícate con Health & Human Services del condado de Humboldt para pedir una evaluación de IHSS. El condado determina la elegibilidad, los servicios autorizados y las horas.",iqd:"Los servicios pueden incluir",iqe:"Según las necesidades de la persona y la autorización del condado, los servicios pueden incluir:",iqf:"Cuidado personal y actividades diarias.",iqg:"Preparación de comidas.",iqh:"Limpieza del hogar y lavado de ropa.",iqi:"Compras de comida, cuando están autorizadas.",iqj:"Cómo encontrar un proveedor de IHSS",iqk:"Las personas elegibles pueden elegir a un proveedor que complete el proceso de inscripción requerido por el condado.",iql:"Recursos para proveedores",iqm:"Los proveedores de IHSS pueden encontrar información sobre inscripción, hojas de tiempo, pagos y requisitos del programa en los recursos oficiales del condado y del estado.",iqn:"Enlaces oficiales",iql1:"Programa IHSS de California (CDSS)",iql2:"Condado de Humboldt",iql3:"Recursos oficiales para proveedores de IHSS (CDSS)",iql4:"Portal de Servicios Electrónicos (ESP): información",iql5:"Ver recursos oficiales para proveedores:",eql1:"Teléfonos de CalFresh de cada condado (CDSS)",eql2:"Más información oficial:",iqo:"⚠ Aviso de privacidad: por favor no nos mandes números de Seguro Social, información médica detallada ni fotos de documentos personales, identificaciones o tarjetas de beneficios.",cmCardT:"Recursos de la comunidad",cmCardS:"Información y apoyo para nuestros vecinos del Sur de Humboldt.",cmH:"Recursos de la comunidad",cmSub:"Información y apoyo para nuestros vecinos del Sur de Humboldt.",cmT1:"EBT y CalFresh",cmD1:"Información de beneficios de comida",cmT2:"IHSS y cuidadores",cmD2:"Apoyo en casa",nutBtn:"ℹ️ Ver información nutricional",nutX:"Cerrar",cardAdd:"Agregar",psQty:"Cantidad",psDone:"Agregar al carrito",psAdd:"Agregar a mi lista",psIn:"en tu lista",psEst:"Precio estimado",cmT3:"Dar y donar",cmD3:"Organizaciones locales y cómo ayudar",cmT4:"Pedir ayuda",cmD4:"Apoyo con las compras",cmSoon:"Próximamente",cmIll:"Imágenes ilustrativas.",cmFollow:"Síguenos",cmFollowS:"Avisos, horarios y noticias de la comunidad.",cmT0:"Nuestra historia y misión",cmD0:"Quiénes somos y por qué lo hacemos",stH:"Nuestra historia y misión",sa1:"Nuestra historia: un servicio local inspirado en la comunidad",sa2:"Redwood Shopper nació con una idea sencilla: hacer más fácil las compras de comida para las personas que viven en Garberville y las comunidades vecinas del Sur de Humboldt.",sa3:"Vivir en una zona rural puede hacer difíciles las compras de todos los días. Muchos residentes deben viajar largas distancias para llegar a una tienda, y no todos tienen el tiempo, el transporte o la posibilidad de hacer esos viajes.",sa4:"Vimos la oportunidad de hacer una diferencia acercando la comida a casa.",sa5:"Lo que empezó como una idea se convirtió en Redwood Shopper: un servicio local de compras y entregas, basado en la comodidad, la confiabilidad y un compromiso sincero con la comunidad a la que servimos.",sa6:"Creemos que los pequeños negocios locales pueden hacer una diferencia importante en la vida diaria de las personas.",sb1:"Nuestra misión: comodidad, cuidado y comunidad juntos",sb2:"Nuestra misión es hacer las compras de comida más cómodas y accesibles para los residentes del Sur de Humboldt, con un servicio de compras y entregas confiable y personalizado.",sb3:"Buscamos hacer la vida diaria más fácil para todos, con atención especial a los vecinos que enfrentan dificultades para conseguir sus alimentos: adultos mayores, personas con discapacidades, familias y personas sin transporte confiable.",sb4:"Además de entregar comida, nos comprometemos a compartir recursos útiles de la comunidad, fomentar el apoyo entre vecinos y crear oportunidades para ayudar a quienes lo necesitan.",sb5:"En Redwood Shopper creemos que una comunidad más fuerte empieza cuidándonos unos a otros.",sc1:"Nuestros valores: en qué creemos",sv1l:"Comunidad:",sv1t:"Apoyar a las personas y los vecindarios que hacen especial al Sur de Humboldt.",sv2l:"Accesibilidad:",sv2t:"Hacer más fáciles las compras de todos los días para más residentes.",sv3l:"Confiabilidad:",sv3t:"Ofrecer un servicio confiable, atento y personalizado.",sv4l:"Compasión:",sv4t:"Tratar a cada cliente y vecino con amabilidad y respeto.",sv5l:"Conexión:",sv5t:"Fomentar el apoyo local y ayudar a que los vecinos se ayuden entre sí.",sv6l:"Empoderamiento:",sv6t:"Ayudar a las personas a conocer y entender los recursos de la comunidad a su alcance.",sd1:"Nuestro compromiso: más que entregar comida",sd2:"Nos enorgullece servir al Sur de Humboldt y creemos que nuestro papel puede ir más allá de entregar comida.",sd3:"Nuestro compromiso es hacer la vida diaria más fácil y conectar a nuestros vecinos con información útil, recursos locales y oportunidades de apoyo.",se1:"Recursos de EBT y CalFresh",se2:"Queremos ayudar a personas y familias a conocer los recursos de CalFresh y EBT, incluidas opciones para quienes tienen dificultad para conseguir alimentos por su edad, una discapacidad, problemas de transporte u otras circunstancias.",se3:"Creemos que todos merecen acceso a información que les ayude a entender sus opciones y el apoyo disponible.",sf1:"Recursos de IHSS y cuidado de personas",sf2:"También queremos compartir información útil sobre los Servicios de Apoyo en el Hogar (IHSS), recursos para cuidadores y programas que apoyan a adultos mayores, personas con discapacidades y sus familias.",sf3:"Como fundadora de Redwood Shopper, tengo experiencia directa como proveedora registrada de IHSS. Esa experiencia me ha ayudado a entender la importancia de un apoyo compasivo, confiable y respetuoso para las personas y las familias.",sf4:"Esperamos usar esa experiencia para ayudar a nuestra comunidad a encontrar información y recursos útiles.",sg1:"Apoyo comunitario",sg2:"Con información de la comunidad, recursos locales e iniciativas futuras como Vecinos Ayudando a Vecinos, esperamos fomentar la amabilidad, la conexión y el apoyo en todo el Sur de Humboldt.",sg3:"Nuestra meta es ayudar a crear una comunidad donde las personas se sientan apoyadas, conectadas y valoradas.",sg4:"En Redwood Shopper creemos que una comunidad más fuerte empieza cuidándonos unos a otros. Nuestro compromiso es crecer junto a nuestra comunidad, una entrega y un vecino a la vez.",sg5:"Redwood Shopper es un negocio local independiente, no una agencia de gobierno. No determinamos la elegibilidad para beneficios públicos ni aprobamos programas de ayuda. Para información oficial de CalFresh e IHSS, comuníquese con la agencia del condado o del estado que corresponda.",cmNews:"Novedades",cmBulT:"El Boletín Redwood",cmBulS:"Información, recursos y vecinos ayudando a vecinos.",addOn:"✓ Esto se enviará como AGREGADO a tu pedido anterior.",addon:"Es un agregado a mi pedido anterior",addonHint:"Márcalo si ya enviaste un pedido y esto es lo que faltó. Lo juntaremos con tu pedido anterior.",consent:"Confirmo que mi pedido es correcto y entiendo que el pago se necesita antes de que compren.",send:"Enviar mi pedido",sending:"Enviando… no cierres esta página.",sentOk:"¡Pedido recibido! Te contactaremos para confirmar el costo y el pago antes de comprar.",sentErr:"No se pudo enviar. Revisa tu conexión e inténtalo otra vez, o copia el resumen y envíalo por mensaje.",needInfo:"Falta tu nombre, teléfono, dirección o comunidad.",needList:"Escribe tu lista o agrega la foto de cada tienda.",needPhoto:"Agrega la foto de tu lista.",needConsent:"Marca la casilla para confirmar tu pedido.",longList:"Tu lista es demasiado larga. Acórtala o envía una foto.",addPhoto:"Foto de tu lista (máximo 3 en total)",takePhoto:"Tomar foto ahora",pickPhoto:"Elegir de mi galería",p h5:"Review and send",sumHelp:"Check your order and press Send. We will review and confirm your order before shopping.",dupWarn:"Some items are repeated in your list. Remove the repeat, or tap Send again if it is fine →",addBtnT:"Forgot something? Add it to your earlier order.",addBtnS:"Select the store, find the product, and add it to your existing order. Use the same phone number and delivery day as your original order.",fgT:"Forgot something?",fgS:"Add what is missing to your earlier order.",fgBtn:"Add item",fgNote:"✓ Pick the store below and type what you forgot. Use the same phone number and delivery day as your first order.",ebtCardT:"EBT & CalFresh Assistance",ebtCardS:"Learn how CalFresh works and explore grocery-shopping assistance options in Southern Humboldt.",ebtCardB:"Learn more",ebtBack:"← Back",ebtH:"EBT & CalFresh Resources",ec1:"CalFresh helps eligible individuals and families purchase nutritious food. We want to share helpful information about EBT resources and options for people who may need assistance getting their groceries.",ec2:"Need Someone to Shop for You?",ec3:"If you receive CalFresh benefits but have difficulty going grocery shopping because of age, disability, transportation challenges, or other circumstances, you may be able to designate an Authorized Representative.",ec4:"What Is an Authorized Representative?",ec5:"An Authorized Representative is someone you trust who can be authorized to help you with certain CalFresh responsibilities, including purchasing groceries on your behalf.",ec6:"How Does It Work?",ec7:"You ask your county CalFresh office to designate someone you trust.",ec8:"Once approved and set up, that person can receive a separate EBT card with their own card number and PIN.",ec9:"The card is connected to your CalFresh benefits account.",eca:"You do not need to share your personal EBT card or PIN.",ecb:"How Can You Request One in Humboldt County?",ecc:"Contact Humboldt County Department of Health & Human Services:",ecd1:"Phone:",ecd2:"Online:",ece:"Ask the county how to designate an Authorized Representative and what forms or steps are required.",ecf:"How Redwood Shopper Can Help",ecg:"Redwood Shopper provides personalized grocery shopping and delivery services for Southern Humboldt residents.",ech:"We also share information about CalFresh resources so customers can better understand their options for getting groceries.",eci:"Important Information",ecj:"CalFresh benefits can only be used for eligible food purchases. Delivery fees and service charges cannot be paid with CalFresh benefits.",eck:"Redwood Shopper is an independent local business, not a government agency. We do not determine eligibility or approve public benefits.",ecl:"For official information, please contact Humboldt County Department of Health & Human Services.",ebtH7:"Official Links",ihCardT:"IHSS & Caregiving Support",ihCardS:"Learn about in-home support, caregiving resources, and help available in Southern Humboldt.",gvH:"Give & Donate",gv1:"Neighbors helping neighbors. Here is how you can help today through local organizations that already accept donations and distribute food in Southern Humboldt.",gv2:"Right now Redwood Shopper does not accept money, food, or donations from anyone. We will never ask you by message for money for another person.",gv3:"Food pantries in Southern Humboldt",gv4:"Food for People gives out free food in the region. Schedules can change, so confirm before you go:",gv5:"Garberville (Presbyterian Church): Tuesdays and Thursdays 10:30–11:45 a.m., Wednesdays 2–4 p.m. Phone (707) 223-3528.",gv6:"Redway (First Baptist Church, 1055 Redway Dr.): second Tuesday of the month, 10:30 a.m.–12:30 p.m.",gv7:"Myers Flat (Volunteer Fire Dept.): first Thursday of the month, 12–2 p.m.",gl1:"Food for People distribution schedule",gv8:"CalFresh help in Garberville",gv9:"The Southern Humboldt Community Park CalFresh program helps people apply for and renew benefits and offers weekly baskets of fresh seasonal food. Phone (707) 923-2928.",gl2:"Community Park CalFresh program",gv10:"If you want to donate",gv11:"You can donate directly to Food for People, a local organization. Ask on their website how to give and whether your donation is tax-deductible.",gl3:"Donate to Food for People",gv12:"Neighbors Helping Neighbors (coming soon)",gv13:"We are preparing a way for neighbors to help each other through Redwood Shopper. It is not ready yet. When it is, we will announce it in News.",gv14:"Want to help, or need help? Send us a message on Facebook or Instagram. Do not include private information.",gl4:"Redwood Shopper on Facebook",gl5:"Redwood Shopper on Instagram",gv15:"⚠ Privacy: do not send us your EBT card number, PIN, Social Security number, or photos of documents.",ihH:"IHSS & Caregiving Support",iq1:"Our Experience with IHSS",iq2:"Our founder has firsthand experience as an enrolled In-Home Supportive Services (IHSS) provider and understands the importance of compassionate, reliable, and respectful care.",iq3:"We value the work of IHSS providers and caregivers who help seniors and individuals with disabilities maintain their independence and remain safely in their homes.",iq4:"We are committed to sharing helpful caregiving information and connecting our community with available resources.",iq5:"Redwood Shopper & IHSS",iq6:"Redwood Shopper is an independent grocery shopping and delivery business, not an official IHSS agency.",iq7:"We do not bill the IHSS program or determine eligibility, authorized services, or hours.",iq8:"Our goal is to make everyday life easier by sharing helpful information and connecting individuals and families with community resources.",iq9:"What Is IHSS?",iqa:"IHSS (In-Home Supportive Services) is a California program that helps eligible seniors, people with disabilities, and individuals who are blind receive assistance in their own homes.",iqb:"How to Apply",iqc:"Contact Humboldt County Health & Human Services to request an IHSS assessment. The county determines eligibility, authorized services, and hours.",iqd:"Services May Include",iqe:"Depending on the individual’s needs and county authorization, services may include:",iqf:"Personal care and daily activities.",iqg:"Meal preparation.",iqh:"Housekeeping and laundry.",iqi:"Grocery shopping, when authorized.",iqj:"Finding an IHSS Provider",iqk:"Eligible recipients may choose a provider who completes the required county enrollment process.",iql:"Provider Resources",iqm:"IHSS providers can find information about enrollment, timesheets, payments, and program requirements through official county and state resources.",iqn:"Official Resources",iql1:"California IHSS Program – CDSS",iql2:"Humboldt County",iql3:"IHSS Provider Resources (CDSS)",iql4:"Electronic Services Portal (ESP) information",iql5:"Official provider resources:",eql1:"CalFresh county phone numbers (CDSS)",eql2:"More official information:",iqo:"⚠ Privacy Notice: Please do not send Social Security numbers, detailed medical information, or photos of personal documents, identification cards, or benefit cards.",cmCardT:"Community & Resources",cmCardS:"Information and support for our Southern Humboldt neighbors.",cmH:"Community & Resources",cmSub:"Information and support for our Southern Humboldt neighbors.",cmT1:"EBT & CalFresh",cmD1:"Food benefit information",cmT2:"IHSS & Caregiving",cmD2:"Support at home",nutBtn:"ℹ️ See nutrition facts",nutX:"Close",cardAdd:"Add",psQty:"Quantity",psDone:"Add to cart",psAdd:"Add to my list",psIn:"in your list",psEst:"Estimated price",cmT3:"Give & Donate",cmD3:"Local organizations and how to help",cmT4:"Request Assistance",cmD4:"Ask for grocery support",cmSoon:"Coming soon",cmIll:"Illustrative images.",cmFollow:"Follow us",cmFollowS:"Updates, schedules, and community news.",cmT0:"Our Story & Mission",cmD0:"Who we are and why we do it",stH:"Our Story & Mission",sa1:"Our Story: A Local Service Inspired by Community",sa2:"Redwood Shopper was created with a simple idea: making grocery shopping easier for people living in Garberville and the surrounding communities of Southern Humboldt.",sa3:"Living in a rural area can make everyday shopping challenging. Many residents must travel long distances to reach grocery stores, and not everyone has the time, transportation, or ability to make those trips.",sa4:"We saw an opportunity to make a difference by bringing groceries closer to home.",sa5:"What started as an idea became Redwood Shopper — a local grocery shopping and delivery service built around convenience, reliability, and a genuine commitment to the community we serve.",sa6:"We believe that small local businesses can make a meaningful difference in people’s everyday lives.",sb1:"Our Mission: Bringing Convenience, Care & Community Together",sb2:"Our mission is to make grocery shopping more convenient and accessible for residents of Southern Humboldt by providing reliable, personalized shopping and delivery services.",sb3:"We strive to make everyday life easier for everyone, while paying special attention to neighbors who may face challenges accessing groceries, including seniors, individuals with disabilities, families, and people without reliable transportation.",sb4:"Beyond grocery delivery, we are committed to sharing helpful community resources, encouraging neighbor-to-neighbor support, and creating opportunities to help those in need.",sb5:"At Redwood Shopper, we believe that a stronger community begins with caring for one another.",sc1:"Our Values: What We Believe In",sv1l:"Community:",sv1t:"Supporting the people and neighborhoods that make Southern Humboldt special.",sv2l:"Accessibility:",sv2t:"Making everyday grocery shopping easier for more residents.",sv3l:"Reliability:",sv3t:"Providing dependable, thoughtful, and personalized service.",sv4l:"Compassion:",sv4t:"Treating every customer and neighbor with kindness and respect.",sv5l:"Connection:",sv5t:"Encouraging local support and helping neighbors help one another.",sv6l:"Empowerment:",sv6t:"Helping people discover and understand the community resources available to them.",sd1:"Our Commitment: More Than Grocery Delivery",sd2:"We are proud to serve Southern Humboldt and believe that our role can go beyond delivering groceries.",sd3:"Our commitment is to help make everyday life easier while connecting our neighbors with helpful information, local resources, and opportunities for support.",se1:"EBT & CalFresh Resources",se2:"We want to help individuals and families learn about CalFresh and EBT resources, including options for people who may have difficulty accessing groceries because of age, disability, transportation challenges, or other circumstances.",se3:"We believe everyone deserves access to information that can help them understand their options and available support.",sf1:"IHSS & Caregiving Resources",sf2:"We also want to share helpful information about In-Home Supportive Services (IHSS), caregiving resources, and programs that support seniors, people with disabilities, and their families.",sf3:"As the founder of Redwood Shopper, I have firsthand experience as an enrolled IHSS provider. This experience has helped me understand the importance of compassionate, reliable, and respectful support for individuals and families.",sf4:"We hope to use this experience to help our community discover useful information and resources.",sg1:"Community Support",sg2:"Through community information, local resources, and future initiatives such as Neighbor Helping Neighbor, we hope to encourage kindness, connection, and support throughout Southern Humboldt.",sg3:"Our goal is to help create a community where people feel supported, connected, and valued.",sg4:"At Redwood Shopper, we believe that a stronger community begins with caring for one another. Our commitment is to grow alongside our community, one delivery and one neighbor at a time.",sg5:"Redwood Shopper is an independent local business, not a government agency. We do not determine eligibility for public benefits or approve assistance programs. For official CalFresh and IHSS information, please contact the appropriate county or state agency.",cmNews:"News",cmBulT:"The Redwood Bulletin",cmBulS:"Knowledge, resources and neighbors helping neighbors.",addOn:"✓ This will be sent as an ADDITION to your earlier order.",addon:"This is an addition to my earlier order",addonHint:"Check this if you already sent an order and this is what you forgot. We will combine it with your earlier order.",consent:"I confirm my order is correct and I understand payment is required before shopping.",send:"Send my order",sending:"Sending… please keep this page open.",sentOk:"Order received! We will contact you to confirm the cost and payment before shopping.",sentErr:"Could not send. Check your connection and try again, or copy the summary and send it by message.",needInfo:"Your name, phone, address or community is missing.",needList:"Write your list or add a photo for each store.",needPhoto:"Please add a photo of your list.",needConsent:"Check the box to confirm your order.",longList:"Your list is too long. Shorten it or send a photo.",addPhoto:"Photo of your list (3 max in total)",takePhoto:"Take a photo now",pickPhoto:"Choose from my gallery",photoErr:"I could not read that photo. Try another one.",maxPhotos:"Maximum 3 photos per order.",rm:"Remove photo",copy:"Just copy the summary",copied:"Copied",wa:"Send by WhatsApp",
