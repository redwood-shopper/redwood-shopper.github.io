<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redwood Shopper</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1d2a22;--mute:#5d6b62;--line:#d9ddd3;--green:#1f5f3a;--on:#fff;--gold:#b7791f;--warn-bg:#fdf3dc;--warn:#6b4a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a15;--card:#1b2620;--ink:#e8efe9;--mute:#9fb0a5;--line:#2c3a32;--green:#4fae7a;--on:#08140d;--gold:#e0a64a;--warn-bg:#2d2610;--warn:#f0d9a0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121a15;--card:#1b2620;--ink:#e8efe9;--mute:#9fb0a5;--line:#2c3a32;--green:#4fae7a;--on:#08140d;--gold:#e0a64a;--warn-bg:#2d2610;--warn:#f0d9a0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 16px}
h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:0}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
#lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;min-height:40px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font:700 18px/1.2 Georgia,serif;margin:0 0 10px}
h3{font:700 16px/1.2 system-ui;margin:0}
.f{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
select,input[type=number],input[type=text],input[type=tel],textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;font:inherit}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px;min-height:56px;cursor:pointer;background:var(--bg)}
.tile input,.chips input,.opt input{position:absolute;opacity:0;pointer-events:none}
.tile .e{font-size:26px}
.tile:has(input:checked),.chips label:has(input:checked),.opt:has(input:checked){border-color:var(--green);background:var(--green);color:var(--on)}
.tile:has(input:focus-visible),.chips label:has(input:focus-visible),.opt:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label,.opt{border:2px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;display:flex;align-items:center;background:var(--bg)}
.opt{margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.chk input{width:22px;height:22px;accent-color:var(--green);flex:none;margin-top:2px}
.store{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.store header{margin:0 0 6px;align-items:center}
.store small{color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.total{font:700 20px/1.2 Georgia,serif;border-bottom:0;padding-top:12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--green);color:var(--on);font:700 16px system-ui;margin-top:12px;cursor:pointer;text-align:center;text-decoration:none;line-height:48px}
#wa{display:none;background:var(--gold);color:#fff}
#sum{min-height:220px;font:14px/1.4 ui-monospace,Menlo,monospace}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
small.h{color:var(--mute)}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:14px;margin-top:10px;cursor:pointer;min-height:44px}
.qa{margin-top:10px}
.qa summary{cursor:pointer;color:var(--green);font-weight:600;min-height:44px;display:flex;align-items:center}
.qa h4{margin:10px 0 4px;font-size:13px;color:var(--mute);font-weight:600}
.qa .c{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 12px;margin:0 6px 6px 0;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.qa .c:focus-visible,.lnk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=file]{width:100%;min-height:44px;margin-top:4px}
.th{display:inline-flex;align-items:center;gap:4px;margin:8px 8px 0 0}
.th img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.th button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer}
.msg{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:15px}
.msg.err{display:block;background:var(--warn-bg);color:var(--warn)}
.msg.ok{display:block;background:var(--green);color:var(--on)}
.go:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<main>
<header><div><h1>Redwood Shopper</h1><p data-t="tag"></p></div><button id="lang" type="button"></button></header>
<div id="repeat" style="display:none"><button class="go" id="repBtn" type="button" style="line-height:1.3;padding:10px 14px;margin:0 0 14px"></button></div>

<section>
 <h2 data-t="h1"></h2>
 <label class="f" for="comm" data-t="lComm"></label>
 <select id="comm"><option value="" data-t="pick"></option>
  <option value="Garberville|1">Garberville</option><option value="Redway|1">Redway</option>
  <option value="Benbow|2">Benbow</option><option value="Miranda|2">Miranda</option><option value="Phillipsville|2">Phillipsville</option>
  <option value="Briceland|3">Briceland</option><option value="Salmon Creek|3">Salmon Creek</option><option value="Piercy|3">Piercy</option>
  <option value="x" data-t="otherC"></option></select>
 <span class="f" data-t="lDay"></span>
 <div class="chips" id="day"><label><input type="radio" name="day" value="Tuesday" checked><span data-t="tue"></span></label><label><input type="radio" name="day" value="Friday"><span data-t="fri"></span></label></div>
 <div class="note" data-t="cutoff"></div>
 <div class="note" id="eta" aria-live="polite"></div>
</section>

<section>
 <h2 data-t="h2"></h2>
 <small class="h" data-t="storeHelp"></small>
 <div class="grid" id="tiles" style="margin-top:10px"></div>
 <div id="lists"></div>
</section>

<section>
 <h2 data-t="h3"></h2>
 <label class="f" for="vol" data-t="lVol"></label>
 <select id="vol"><option value="0" data-t="v0"></option><option value="1" data-t="v1"></option><option value="2" data-t="v2"></option></select>
 <div style="margin-top:12px" id="out" aria-live="polite"></div>
 <div class="note" data-t="n1"></div>
 <div class="note" data-t="n2"></div>
</section>

<section>
 <h2 data-t="h4"></h2>
 <small class="h" data-t="saveNote"></small>
 <label class="f" for="name" data-t="lName"></label><input type="text" id="name" autocomplete="name">
 <label class="f" for="phone" data-t="lPhone"></label><input type="tel" id="phone" autocomplete="tel">
 <label class="f" for="email" data-t="lEmail"></label><input type="text" id="email" inputmode="email" autocomplete="email">
 <label class="f" for="addr" data-t="lAddr"></label><input type="text" id="addr" autocomplete="street-address">
 <label class="f" for="inst" data-t="lInst"></label><input type="text" id="inst">
 <span class="f" data-t="lPay"></span>
 <div class="chips" id="pay"><label><input type="radio" name="pay" value="Cash App" checked><span>Cash App</span></label><label><input type="radio" name="pay" value="Zelle"><span>Zelle</span></label><label><input type="radio" name="pay" value="Cash"><span data-t="cash"></span></label><label><input type="radio" name="pay" value="Other"><span data-t="oth"></span></label></div>
 <div class="note" data-t="payNote"></div>
 <label class="chk"><input type="checkbox" id="auth"><span data-t="auth"></span></label>
 <span class="f" data-t="lRef"></span>
 <label class="opt"><input type="radio" name="ref" value="r1" checked><span data-t="r1"></span></label>
 <label class="opt"><input type="radio" name="ref" value="r2"><span data-t="r2"></span></label>
 <label class="opt"><input type="radio" name="ref" value="r3"><span data-t="r3"></span></label>
 <label class="opt"><input type="radio" name="ref" value="r4"><span data-t="r4"></span></label>
 <label class="f" for="spec" data-t="lSpec"></label><textarea id="spec" style="min-height:80px"></textarea>
 <button type="button" class="lnk" id="forget" data-t="forget"></button>
</section>

<section>
 <h2 data-t="h5"></h2>
 <small class="h" data-t="sumHelp"></small>
 <textarea id="sum" readonly style="margin-top:10px"></textarea>
 <div id="sendBox">
  <label class="chk"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
  <div style="position:absolute;left:-9999px" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
  <button class="go" id="send" type="button" data-t="send"></button>
 </div>
 <div class="msg" id="msg" role="status" aria-live="polite"></div>
 <button class="go" id="copy" type="button" style="background:var(--bg);color:var(--ink);border:2px solid var(--line)"></button>
 <a class="go" id="wa" target="_blank" rel="noopener"></a>
</section>
</main>

var lang="es",lists={},buds={},sel={},modes={},pcount={};

function money(n){return "$"+n.toFixed(2).replace(/\.00$/,"")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
